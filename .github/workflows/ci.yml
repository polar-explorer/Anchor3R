name: Inference package checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cpu:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    env:
      OMP_NUM_THREADS: "1"
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y libsuitesparse-dev
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel build
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy scipy cython -c requirements.txt
          python -m pip install --no-build-isolation scikit-sparse -c requirements.txt
          python -m pip install -r requirements.txt
          python -m pip install -e . --no-deps
          python -m pip check
      - name: Check source syntax
        run: python -m compileall -q anchor3r infer.py demo_viser.py scripts tools
      - name: Build source and wheel distributions
        run: python -m build
      - name: Verify installed entry points outside the checkout
        run: |
          python -m pip uninstall -y anchor3r
          python -m pip install --no-deps dist/*.whl
          cd /tmp
          anchor3r-infer --help
          anchor3r-viser --help
          python -c 'from infer import parse_config; assert parse_config([])["loop"]["enabled"] is False'
